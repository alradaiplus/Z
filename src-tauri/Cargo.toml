[package]
name = "z-desktop"
version = "0.1.0"
description = "Z — Notes (desktop shell)"
authors = ["alradaiplus"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "z_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
